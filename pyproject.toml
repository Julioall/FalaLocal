[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocalis-desktop"
version = "0.1.0"
description = "Vocalis desktop app for local Brazilian Portuguese Kokoro TTS generation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "click>=8.1,<9",
    "kokoro>=0.9.4,<1",
    "numpy>=1.26,<3",
    "PySide6>=6.7,<6.10",
    "qtawesome>=1.3,<2",
    "soundfile>=0.12,<1",
]

[project.scripts]
vocalis = "kokoro_ptbr_desktop.app:main"
kokoro-ptbr-desktop = "kokoro_ptbr_desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
